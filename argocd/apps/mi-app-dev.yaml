apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-app-dev
  namespace: argocd
spec:
  project: default
  source:
    # Cambia esto por la URL de tu repo cuando lo subas a GitHub/GitLab
    repoURL: https://github.com/TU-USUARIO/gitops-lab.git
    targetRevision: main
    path: charts/mi-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mi-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
