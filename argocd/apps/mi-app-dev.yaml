apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-app-dev
  namespace: argocd # las Application SIEMPRE viven en el namespace de ArgoCD
spec:
  project: default
  source:
    repoURL: https://github.com/EstebanJS/gitops-lab.git
    targetRevision: main # rama, tag o commit que ArgoCD vigila
    path: charts/mi-app # carpeta del chart dentro del repo
    helm:
      valueFiles:
      - values-dev.yaml # ruta RELATIVA al path del chart
  destination:
    server: https://kubernetes.default.svc # el mismo clúster donde corre ArgoCD
    namespace: dev # donde se despliega tu app
  syncPolicy:
    automated:
      selfHeal: true # ArgoCD corrige los cambios manuales en el clúster
      prune: true # ArgoCD borra recursos que ya no están en el repo
    syncOptions:
    - CreateNamespace=true # crea el namespace dev si no existe
